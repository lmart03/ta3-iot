[platformio]
default_envs = esp32dev

[env:esp32dev]
; board-esp32-devkit-c-v4 de Wokwi == ESP32 DevKit C -> "esp32dev"
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx@^1.19
    knolleary/PubSubClient@^2.8

; Parametros configurables (se pueden sobreescribir aqui sin tocar el codigo).
; Nota: las comillas se escapan como \" para que lleguen al C++ como string.
; DEMO_MODE: 1 = datos sinteticos, 0 = sensores Wokwi
; PUBLISH_INTERVAL_MS: 1000 (tiempo casi real), 5000 (demo) o 10000 (consigna TA3: lectura cada 10 s)
build_flags =
    -DDEMO_MODE=1
    -DPUBLISH_INTERVAL_MS=500
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DMQTT_HOST=\"broker.emqx.io\"
    -DMQTT_PORT=1883
    -DMQTT_TOPIC_BASE=\"ta3utp-dcb377d0d1/smart-environment/esp32-001\"
    -DCORE_DEBUG_LEVEL=0
