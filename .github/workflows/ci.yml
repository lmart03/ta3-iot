name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar compose
        run: cp .env.example .env && docker compose config -q
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests del ingestor
        run: |
          pip install -r services/mqtt-ingestor/requirements.txt pytest
          pytest services/mqtt-ingestor/tests -q
      - name: Dashboard al dia
        run: node scripts/build-dashboard.mjs && git diff --exit-code docker/grafana/dashboards
